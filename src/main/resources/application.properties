spring.application.name=eventos-api

# Banco (valores padrão para desenvolvimento local; sobrescreva com variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Eventos?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JWT: segredo obrigatório (mínimo 32 caracteres), validade do token e flag Secure do cookie (true em produção/HTTPS)
jwt.secret=${JWT_SECRET}
jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:60}
jwt.cookie-seguro=${JWT_COOKIE_SEGURO:false}

# Front-ends autorizados a chamar a API com cookies (separados por vírgula)
cors.origens-permitidas=${CORS_ORIGENS:http://localhost:4200}

# Usuário administrador criado na primeira subida
admin.username=${ADMIN_USERNAME:admin}
admin.senha=${ADMIN_SENHA:123456}

# Nunca devolver detalhes internos (stack trace, mensagens de exceção) nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=never

spring.jpa.show-sql=${SHOW_SQL:false}

# Email (SMTP). Sem EMAIL_HOST e EMAIL_REMETENTE (ou EMAIL_USUARIO), os emails não são enviados e o resto funciona normalmente
spring.mail.host=${EMAIL_HOST:}
spring.mail.port=${EMAIL_PORTA:587}
spring.mail.username=${EMAIL_USUARIO:}
spring.mail.password=${EMAIL_SENHA:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${EMAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
email.remetente=${EMAIL_REMETENTE:}
email.nome-remetente=${EMAIL_NOME_REMETENTE:Equipe de Eventos}
